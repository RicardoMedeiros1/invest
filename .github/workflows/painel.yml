# Gera o painel (carteira_simples.py) durante o pregão e publica no GitHub Pages.
# Para ligar: Settings > Pages > Build and deployment > Source: "GitHub Actions" (o repositório precisa ser público
# ou a conta ter GitHub Pro). O endereço aparece no fim da execução, na aba Actions.
# A página aberta no navegador relê dados.json sozinha a cada minuto, então os preços novos aparecem sem recarregar.
name: Painel

on:
  schedule:
    # De 15 em 15 minutos, das 10h07 às 18h52 em Brasília (UTC-3, sem horário de verão), de segunda a sexta.
    # Os minutos 7, 22, 37 e 52 são de propósito: o GitHub atrasa ou descarta execuções agendadas nos horários de pico
    # (:00, :15, :30, :45). Mesmo assim ele pode atrasar; o painel avisa quando os preços estão velhos.
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch:           # botão "Run workflow" na aba Actions, para atualizar na hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false    # não interrompe uma publicação em andamento; no máximo uma fica esperando

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gerar o painel
        run: python carteira_simples.py --valor 200 --sem-abrir --saida site/index --link-planilha index.xlsx --dados-json dados.json --intervalo-min 15
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
